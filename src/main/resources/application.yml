spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/testpoint}
    username: ${DB_USERNAME:testpoint}
    password: ${DB_PASSWORD:testpoint}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8081

app:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-long-secret-key-for-testpoint-dev-only}
    expiration-minutes: 720
  cors:
    origins: ${CORS_ORIGINS:http://localhost:3000}
  ai:
    enabled: ${AI_ENABLED:false}
    api-key: ${AI_API_KEY:}
    base-url: ${AI_BASE_URL:https://api.openai.com/v1}
    model: ${AI_MODEL:gpt-4o-mini}
